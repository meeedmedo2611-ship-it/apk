<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التزام الفروع بأوقات الافتتاح والإغلاق</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<script src="xlsx.full.min.js"></script>
<style>
:root{--bg:#f2f5f4;--card:#fff;--ink:#14201e;--mut:#5b6a67;--line:#dce3e1;--ac:#0f5e63;--acbg:#e3f1f1;--ok:#1b7a4b;--bad:#b3261e;--warn:#9a6700;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1514;--card:#18211f;--ink:#e8efed;--mut:#9eafab;--line:#2a3633;--ac:#5cc3c9;--acbg:#1c3333;--ok:#5fcf90;--bad:#ff8a80;--warn:#e3b341;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1514;--card:#18211f;--ink:#e8efed;--mut:#9eafab;--line:#2a3633;--ac:#5cc3c9;--acbg:#1c3333;--ok:#5fcf90;--bad:#ff8a80;--warn:#e3b341;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,Tahoma,sans-serif;line-height:1.6;font-size:15px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:760px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:21px;margin:6px 0 2px;font-weight:700}
.sub{color:var(--mut);margin:0 0 14px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.up{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--ac);color:var(--ac);border-radius:10px;padding:16px;font-weight:600;cursor:pointer;text-align:center}
.up input{display:none}
#msg{margin:8px 0 0;font-size:13px;color:var(--mut)}#msg.err{color:var(--bad)}
.set{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label.f{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
input,select{font:inherit;font-size:15px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.k b{display:block;font-size:26px;line-height:1.2}.k span{font-size:12px;color:var(--mut)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.ins{background:var(--acbg);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.flt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1;font:inherit;font-weight:600;padding:9px 4px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:8px 9px;text-align:center;border-bottom:1px solid var(--line)}
th{background:var(--acbg);font-weight:600;position:sticky;top:0}
td:first-child,th:first-child{text-align:right}
td small{display:block;color:var(--mut);font-size:11px}
.hint{font-size:13px;color:var(--mut)}
[hidden]{display:none!important}
.tabs button{font-size:13px;padding:9px 2px}
.dl{display:flex;gap:8px;padding:12px 12px 0}.dl button{flex:1;font:inherit;font-weight:600;padding:10px;border:0;border-radius:9px;background:var(--ac);color:var(--bg);cursor:pointer}
.rep h2{font-size:16px;margin:14px 12px 6px}.rep p,.rep ul{margin:4px 12px}.rep ul{padding-inline-start:20px}
</style>
</head>
<body>
<main>
<h1>التزام الفروع بأوقات الافتتاح والإغلاق</h1>
<p class="sub">ارفع ملف الإكسل الشهري، والتحليل يتحدّث فوراً عند تغيير الإعدادات.</p>

<div class="card">
  <label class="up"><input type="file" id="file" accept=".xlsx,.xlsm,.xls"><span id="upt">اختر ملف الفترة الحالية</span></label>
  <label class="up" style="margin-top:8px;border-style:solid;opacity:.85"><input type="file" id="file2" accept=".xlsx,.xlsm,.xls"><span id="upt2">+ ملف للمقارنة (اختياري، فترة سابقة)</span></label>
  <p id="msg" class="hint">المطلوب: ورقة فيها الأعمدة: التاريخ، الدائرة، الفرع، افتتاح رسمي، اغلاق رسمي، افتتاح فعلي، اغلاق فعلي (مثل ورقة «البيانات»).</p>
</div>

<div class="card set">
  <label class="f">هامش السماح (دقيقة)<input id="tol" type="number" min="0" value="15" inputmode="numeric"></label>
  <label class="f">استبعاد افتتاح الجمعة<select id="fri"><option value="1">نعم</option><option value="0">لا</option></select></label>
  <label class="f">إغلاق مشكوك حتى ساعة<input id="sus" type="number" min="0" max="23" value="15" inputmode="numeric"></label>
</div>

<div id="res" hidden>
  <div class="kpis" id="kpis"></div>
  <div class="ins" id="ins"></div>
  <div class="flt">
    <select id="circ"></select>
    <input id="q" type="search" placeholder="بحث باسم الفرع">
  </div>
  <div class="tabs" id="tabs">
    <button class="on" data-t="b">الفروع</button><button data-t="d">الأيام</button><button data-t="v">المخالفات</button><button data-t="c" id="tcb" hidden>مقارنة</button><button data-t="r">تقرير الإدارة</button>
  </div>
  <div class="tw" id="t-b"></div>
  <div class="tw" id="t-d" hidden></div>
  <div class="tw" id="t-v" hidden></div>
  <div class="tw" id="t-c" hidden></div>
  <div class="tw rep" id="t-r" hidden><div class="dl" id="dlb" hidden><button id="bx">تحميل Excel</button><button id="bh">تحميل التقرير</button></div><div id="rep"></div></div>
</div>
</main>
<script>
const $=s=>document.querySelector(s);
const DN=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
let raw=[],last=null;const ds={A:null,B:null};
const fr=v=>v-Math.floor(v);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pc=(a,b)=>b?a/b:null;
const fp=x=>x==null?'—':(Math.round(x*1000)/10)+'%';
const cl=x=>x==null?'':x>=.95?'ok':x>=.85?'warn':'bad';
function msg(t,e){const m=$('#msg');m.textContent=t;m.className=e?'err':'hint'}

['file','file2'].forEach(id=>$('#'+id).addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{try{parse(XLSX.read(ev.target.result,{type:'array'}),f.name,id==='file2'?'B':'A')}catch(err){msg('تعذّر قراءة الملف: '+err.message,1)}};
  r.readAsArrayBuffer(f);
}));

function parse(wb,name,slot){
  const names=wb.SheetNames.slice().sort((a,b)=>(b==='البيانات')-(a==='البيانات'));
  for(const n of names){
    const a=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});
    const hi=a.findIndex(r=>r&&r.some(c=>String(c).trim()==='الفرع')&&r.some(c=>String(c).trim()==='افتتاح فعلي'));
    if(hi<0) continue;
    const h=a[hi].map(c=>String(c==null?'':c).trim()), ix=k=>h.indexOf(k);
    const C={d:ix('التاريخ'),c:ix('الدائرة'),b:ix('الفرع'),oo:ix('افتتاح رسمي'),oc:ix('اغلاق رسمي'),ao:ix('افتتاح فعلي'),ac:ix('اغلاق فعلي')};
    if(C.d<0||C.oo<0||C.oc<0||C.ao<0||C.ac<0){continue}
    const rs=a.slice(hi+1).filter(r=>r&&r[C.b]&&typeof r[C.d]==='number').map(r=>({
      d:r[C.d],c:C.c>=0?String(r[C.c]||'').trim():'',b:String(r[C.b]).trim(),
      oo:r[C.oo],oc:r[C.oc],ao:r[C.ao],ac:r[C.ac]}));
    if(!rs.length) continue;
    if(slot==='B'){ds.B={name:name.replace(/\.[^.]+$/,''),rows:rs};$('#upt2').textContent=name;msg('تم تحميل ملف المقارنة ('+rs.length+' سجل)');if(raw.length)render();return}
    raw=rs;const cs=[...new Set(raw.map(r=>r.c).filter(Boolean))];
    $('#circ').innerHTML='<option value="">كل الدوائر</option>'+cs.map(c=>`<option>${esc(c)}</option>`).join('');
    $('#upt').textContent=name;
    msg(`تم تحميل ${raw.length} سجل من ورقة «${n}»`);
    $('#res').hidden=false; render(); return;
  }
  msg('ما لقيت جدول بالأعمدة المطلوبة (التاريخ، الفرع، افتتاح/اغلاق رسمي وفعلي).',1);
}

function calc(src){
  const tol=+$('#tol').value||0, exF=$('#fri').value==='1', sus=(+$('#sus').value||0)/24;
  const circ=$('#circ').value, q=$('#q').value.trim();
  return (src||raw).filter(r=>(!circ||r.c===circ)&&(!q||r.b.includes(q))).map(r=>{
    const a=r.ao,c=r.ac,fri=new Date(Math.round((r.d-25569)*864e5)).getUTCDay()===5;
    let os,od=null,cs,cd=null;
    if(a==null||a==='') os='لا بيانات';
    else if(a==='مغلق'||a==='جرد') os=a;
    else if(typeof a!=='number'||typeof r.oo!=='number') os='بدون مرجع';
    else if(fri&&exF) os='جمعة';
    else{od=Math.round((fr(a)-fr(r.oo))*1440);os=od<=tol?'ملتزم':'متأخر'}
    if(c==null||c==='') cs='لا بيانات';
    else if(c==='مغلق'||c==='جرد') cs=c;
    else if(typeof c!=='number'||typeof r.oc!=='number') cs='بدون مرجع';
    else{
      const f=fr(c);
      if(f>=.25&&f<sus) cs='مشكوك';
      else{let oc=fr(r.oc);if(oc<.25)oc++;cd=Math.round(((f<.25?f+1:f)-oc)*1440);cs=cd>=-tol?'ملتزم':'مبكر'}
    }
    return{...r,os,od,cs,cd}
  });
}
function agg(rows,key){
  const m=new Map();
  for(const r of rows){
    const k=key(r); if(!m.has(k)) m.set(k,{k,c:r.c,oo:0,ol:0,co:0,ce:0,nd:0,mx:0,d:r.d});
    const g=m.get(k);
    if(r.os==='ملتزم')g.oo++; else if(r.os==='متأخر'){g.ol++;g.mx=Math.max(g.mx,r.od)}
    if(r.cs==='ملتزم')g.co++; else if(r.cs==='مبكر')g.ce++;
    if(r.os==='لا بيانات'&&r.cs==='لا بيانات')g.nd++;
  }
  return [...m.values()].map(g=>({...g,po:pc(g.oo,g.oo+g.ol),pcl:pc(g.co,g.co+g.ce),pt:pc(g.oo+g.co,g.oo+g.ol+g.co+g.ce),v:g.ol+g.ce}));
}
const cell=x=>`<td class="${cl(x)}">${fp(x)}</td>`;
function render(){
  const rows=calc(), br=agg(rows,r=>r.b), dy=agg(rows,r=>r.d);
  const T=agg(rows,()=>1)[0]||{oo:0,ol:0,co:0,ce:0,v:0};
  const po=pc(T.oo,T.oo+T.ol), pcx=pc(T.co,T.co+T.ce), pt=pc(T.oo+T.co,T.oo+T.ol+T.co+T.ce);
  $('#kpis').innerHTML=[['التزام الافتتاح',fp(po),cl(po)],['التزام الإغلاق',fp(pcx),cl(pcx)],['الالتزام الكلي',fp(pt),cl(pt)],['إجمالي المخالفات',T.v,T.v?'bad':'ok']]
    .map(k=>`<div class="k"><span>${k[0]}</span><b class="${k[2]}">${k[1]}</b></div>`).join('');
  const ranked=br.filter(b=>b.pt!=null).sort((a,b)=>a.pt-b.pt||b.v-a.v);
  const full=ranked.filter(b=>b.pt===1).length;
  $('#ins').textContent=ranked.length?`فروع التزامها 100%: ${full} من ${ranked.length} — الأقل التزاماً: ${ranked[0].k} (${fp(ranked[0].pt)})`+(po!=null&&pcx!=null?` — ${po<pcx?'الافتتاح':'الإغلاق'} هو نقطة الضعف`:''):'لا توجد بيانات ضمن الفلتر الحالي';
  $('#t-b').innerHTML=tbl(['الفرع','افتتاح','إغلاق','كلي','تأخر','إغلاق مبكر'],ranked.concat(br.filter(b=>b.pt==null)).map(b=>`<tr><td>${esc(b.k)}<small>${esc(b.c)}</small></td>${cell(b.po)}${cell(b.pcl)}${cell(b.pt)}<td>${b.ol}</td><td>${b.ce}</td></tr>`));
  $('#t-d').innerHTML=tbl(['اليوم','افتتاح','إغلاق','كلي','مخالفات','بلا بيانات'],dy.sort((a,b)=>a.d-b.d).map(g=>{
    const d=new Date(Math.round((g.d-25569)*864e5));
    return `<tr><td>${d.getUTCDate()}/${d.getUTCMonth()+1}<small>${DN[d.getUTCDay()]}</small></td>${cell(g.po)}${cell(g.pcl)}${cell(g.pt)}<td>${g.v}</td><td>${g.nd}</td></tr>`}));
  const vs=rows.filter(r=>r.os==='متأخر'||r.cs==='مبكر').sort((a,b)=>a.d-b.d);
  const vr=[];
  for(const r of vs){
    const d=new Date(Math.round((r.d-25569)*864e5)),ds=`${d.getUTCDate()}/${d.getUTCMonth()+1}`;
    if(r.os==='متأخر')vr.push(`<tr><td>${ds}<small>${DN[d.getUTCDay()]}</small></td><td>${esc(r.b)}</td><td class="bad">تأخر افتتاح</td><td>+${r.od} د</td></tr>`);
    if(r.cs==='مبكر')vr.push(`<tr><td>${ds}<small>${DN[d.getUTCDay()]}</small></td><td>${esc(r.b)}</td><td class="warn">إغلاق مبكر</td><td>${r.cd} د</td></tr>`);
  }
  $('#t-v').innerHTML=tbl(['التاريخ','الفرع','النوع','الفارق'],vr);
  last={rows,br,dy,vs,T:sum(rows)};renderCmp();$('#rep').innerHTML=repHTML();
}
function tbl(h,b){return `<table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${b.join('')||`<tr><td colspan="${h.length}">لا توجد بيانات</td></tr>`}</tbody></table>`}

['tol','fri','sus','circ','q'].forEach(i=>$('#'+i).addEventListener('input',()=>raw.length&&render()));
$('#tabs').addEventListener('click',e=>{
  const t=e.target.dataset.t; if(!t) return;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b===e.target));
  ['b','d','v','c','r'].forEach(k=>$('#t-'+k).hidden=k!==t);
});

function sum(r){const T=agg(r,()=>1)[0]||{oo:0,ol:0,co:0,ce:0,v:0};return{...T,po:pc(T.oo,T.oo+T.ol),pcx:pc(T.co,T.co+T.ce),pt:pc(T.oo+T.co,T.oo+T.ol+T.co+T.ce)}}
const fd=s=>{const d=new Date(Math.round((s-25569)*864e5));return d.getUTCDate()+'/'+(d.getUTCMonth()+1)+'/'+d.getUTCFullYear()};
const P1=x=>x==null?'':Math.round(x*1000)/10;
function dlt(a,b,p,inv){if(a==null||b==null)return'—';let d=a-b;if(p)d=P1(d);const g=inv?-d:d;return `<span class="${g>0?'ok':g<0?'bad':''}">${d>0?'▲':d<0?'▼':'='} ${Math.abs(d)}${p?'%':''}</span>`}
function cmpB(){
  if(!ds.B)return[];
  const m=new Map(agg(calc(ds.B.rows),r=>r.b).map(b=>[b.k,b]));
  return last.br.filter(b=>b.pt!=null&&m.get(b.k)&&m.get(b.k).pt!=null).map(b=>({k:b.k,c:b.c,a:b.pt,b:m.get(b.k).pt,d:b.pt-m.get(b.k).pt})).sort((x,y)=>x.d-y.d)}
function renderCmp(){
  $('#tcb').hidden=!ds.B; if(!ds.B){$('#t-c').innerHTML='';return}
  const S=last.T,Q=sum(calc(ds.B.rows));
  const m=(n,a,b,p,i)=>`<tr><td>${n}</td><td>${p?fp(a):a}</td><td>${p?fp(b):b}</td><td>${dlt(a,b,p,i)}</td></tr>`;
  $('#t-c').innerHTML=tbl(['المؤشر','الحالية','السابقة','الفرق'],[m('الافتتاح',S.po,Q.po,1),m('الإغلاق',S.pcx,Q.pcx,1),m('الكلي',S.pt,Q.pt,1),m('المخالفات',S.v,Q.v,0,1)])+'<div style="height:10px"></div>'+tbl(['الفرع','الحالية','السابقة','الفرق'],cmpB().map(r=>`<tr><td>${esc(r.k)}<small>${esc(r.c)}</small></td>${cell(r.a)}${cell(r.b)}<td>${dlt(r.a,r.b,1)}</td></tr>`));
}
function repHTML(){
  const {rows,br,dy,T}=last,d0=rows.map(r=>r.d);
  if(!d0.length)return'<p>لا توجد بيانات ضمن الفلتر الحالي.</p>';
  const rk=br.filter(b=>b.pt!=null).sort((a,b)=>a.pt-b.pt||b.v-a.v),full=rk.filter(b=>b.pt===1);
  const ci=agg(rows,r=>r.c||'—').sort((a,b)=>(a.pt??2)-(b.pt??2));
  const wd=dy.filter(g=>g.pt!=null).sort((a,b)=>a.pt-b.pt).slice(0,3);
  const rp=rk.filter(b=>b.v>=3),nd=rows.filter(r=>r.os==='لا بيانات'&&r.cs==='لا بيانات').length;
  const dn=g=>{const d=new Date(Math.round((g.d-25569)*864e5));return DN[d.getUTCDay()]+' '+d.getUTCDate()+'/'+(d.getUTCMonth()+1)};
  let h=`<h2>ملخص تنفيذي</h2><p>الفترة ${fd(Math.min(...d0))} – ${fd(Math.max(...d0))} • ${br.length} فرع • هامش السماح ${esc($('#tol').value)} دقيقة.</p><p>الالتزام الكلي <b>${fp(T.pt)}</b> (افتتاح ${fp(T.po)}، إغلاق ${fp(T.pcx)}) وإجمالي المخالفات ${T.v}. ${T.po!=null&&T.pcx!=null?(T.po<T.pcx?'الافتتاح':'الإغلاق')+' هو نقطة الضعف. ':''}${full.length} فرع من ${rk.length} التزامها 100%.</p>`;
  if(ds.B){
    const Q=sum(calc(ds.B.rows)),c=cmpB(),dn_=c.filter(x=>x.d<0).slice(0,3),up=c.filter(x=>x.d>0).slice(-3).reverse();
    h+=`<h2>مقارنة مع «${esc(ds.B.name)}»</h2><p>الالتزام الكلي ${fp(Q.pt)} ← ${fp(T.pt)}، والمخالفات ${Q.v} ← ${T.v}.</p>`;
    if(dn_.length)h+=`<p>أكبر تراجع: ${dn_.map(x=>esc(x.k)+' ('+P1(x.d)+'%)').join('، ')}</p>`;
    if(up.length)h+=`<p>أكبر تحسّن: ${up.map(x=>esc(x.k)+' (+'+P1(x.d)+'%)').join('، ')}</p>`;
  }
  h+='<h2>حسب الدائرة</h2>'+tbl(['الدائرة','افتتاح','إغلاق','كلي','مخالفات'],ci.map(g=>`<tr><td>${esc(g.k)}</td>${cell(g.po)}${cell(g.pcl)}${cell(g.pt)}<td>${g.v}</td></tr>`));
  h+='<h2>الفروع الأقل التزاماً</h2>'+tbl(['الفرع','كلي','تأخر','إغلاق مبكر','أقصى تأخير'],rk.filter(b=>b.pt<1).slice(0,5).map(b=>`<tr><td>${esc(b.k)}<small>${esc(b.c)}</small></td>${cell(b.pt)}<td>${b.ol}</td><td>${b.ce}</td><td>${b.mx} د</td></tr>`));
  h+='<h2>ملاحظات للمتابعة</h2><ul>'+(wd.length?`<li>أضعف الأيام: ${wd.map(g=>dn(g)+' ('+fp(g.pt)+')').join('، ')}</li>`:'')+(rp.length?`<li>فروع تكررت فيها المخالفة 3 مرات أو أكثر: ${rp.map(b=>esc(b.k)).join('، ')}</li>`:'')+`<li>سجلات بلا بيانات: ${nd} من ${rows.length}، وهي مستبعدة من النسب.</li></ul>`;
  return h;
}
function xl(){
  const {br,dy,vs,T}=last,wb=XLSX.utils.book_new();
  wb.Workbook={Views:[{RTL:true}]};
  const add=(n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n);
  add('ملخص',[['المؤشر','القيمة'],['التزام الافتتاح %',P1(T.po)],['التزام الإغلاق %',P1(T.pcx)],['الالتزام الكلي %',P1(T.pt)],['إجمالي المخالفات',T.v]]);
  add('الفروع',[['الدائرة','الفرع','التزام الافتتاح %','التزام الإغلاق %','الالتزام الكلي %','مرات التأخر','إغلاق مبكر','أقصى تأخير (د)']].concat(br.slice().sort((a,b)=>(a.pt??2)-(b.pt??2)).map(b=>[b.c,b.k,P1(b.po),P1(b.pcl),P1(b.pt),b.ol,b.ce,b.mx])));
  add('الأيام',[['التاريخ','افتتاح %','إغلاق %','كلي %','مخالفات','بلا بيانات']].concat(dy.slice().sort((a,b)=>a.d-b.d).map(g=>[fd(g.d),P1(g.po),P1(g.pcl),P1(g.pt),g.v,g.nd])));
  add('المخالفات',[['التاريخ','الدائرة','الفرع','النوع','الفارق (د)']].concat(vs.flatMap(r=>{const o=[];if(r.os==='متأخر')o.push([fd(r.d),r.c,r.b,'تأخر افتتاح',r.od]);if(r.cs==='مبكر')o.push([fd(r.d),r.c,r.b,'إغلاق مبكر',r.cd]);return o})));
  if(ds.B)add('مقارنة',[['الفرع','الحالية %','السابقة %','الفرق %']].concat(cmpB().map(x=>[x.k,P1(x.a),P1(x.b),P1(x.d)])));
  return wb;
}
let DL=null;

const b64=d=>{const u=typeof d==='string'?new TextEncoder().encode(d):new Uint8Array(d);let t='';for(let i=0;i<u.length;i+=8192)t+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(t)};
async function save(n,d){
  try{
    if(DL)return await DL.save({filename:n,data:d});
    if(CAP&&CAP.Filesystem&&CAP.Share){const r=await CAP.Filesystem.writeFile({path:n,data:b64(d),directory:'CACHE'});return await CAP.Share.share({title:n,url:r.uri})}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d]));a.download=n;a.click();
  }catch(e){if(!e||e.code!=='declined')msg('تعذّر الحفظ: '+(e&&(e.message||e.code||e)),1)}
}
